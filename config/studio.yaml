# Kalainova studio config. Swap models here, not in code.
# Preference: providers are tried in order, and only those listed. "local" makes placeholders that
# `approve` refuses; remove it here, or pin providers in job.json, to stop a job instead.
# Prices are estimates for the job cost cap; the invoice is the truth. Re-check monthly.

preference:
  llm: [anthropic]
  voice: [elevenlabs, local]
  image: [fal, local]
  video: [fal]
  music: [elevenlabs, fal, local]
  sfx: [elevenlabs, local]
  transcribe: [fal]
  song: []

# How long the engine waits for one call. A provider's own timeouts should be shorter.
deadlines_sec:
  llm: 660
  voice: 180
  image: 960
  video: 1900
  music: 960
  sfx: 180
  transcribe: 960
  song: 960

models:
  anthropic:
    llm: claude-opus-5-5
  elevenlabs:
    voice: eleven_v4_turbo            # Eleven v4 Turbo: #2 TTS arena, half v4's price. Premium: eleven_v4. VERIFY id in ElevenLabs docs.
    voice_id: JBFqnCBsd6RMkjVDRZzb   # replace with your house voice
    music: music_v1
  fal:
    # Slugs: confirm with the fal MCP search_models/get_model_schema before first paid run.
    image: google/nano-banana-2.1                   # slug from fal's model page; default; premium = GPT Image 2.5 via OpenAI
    image_edit: google/nano-banana-2.1/edit         # takes reference images; see reference_models
    reference_to_video: alibaba/wan-3.0-prime/reference-to-video
    video: fal-ai/wan/v3/text-to-video              # Wan 3.0: #1 AA T2V, $0.20/s at 1080p
    image_to_video: fal-ai/wan/v3/image-to-video    # premium = Seedance 2.5 / Kling 4.0
    video_durations: "5,10"                         # seconds the model accepts; VERIFY per model
    image_to_video_durations: "5,10"
    music: fal-ai/lyria3                            # Lyria 3 Pro ~$0.08/song; alt ElevenLabs Music v2
    transcribe: fal-ai/whisper     # swap for ElevenLabs Scribe v2 (2.2% WER) when added

prices:
  anthropic:
    llm: {input_per_mtok: 15.0, output_per_mtok: 75.0}
  elevenlabs:
    voice: {per_kchar: 0.04}       # v4 Turbo $40 / 1M chars
    music: {per_min: 0.80}
    sfx: {per_min: 0.50}
  fal:
    image: {per_image: 0.05}       # Nano Banana 2.1 2K
    video: {per_sec: 0.20}         # Wan 3.0 1080p
    image_to_video: {per_sec: 0.20}
    reference_to_video: {per_sec: 0.20}  # ESTIMATE, not a quoted price: check the chosen model. Kling O1 listed $0.112/s.
    music: {per_track: 0.08}
    transcribe: {per_min: 0.01}

# Models that can hold a face: how each takes reference images. Only these may be pinned by a stream
# with a character. Fields come from fal's public model pages. VERIFY against get_model_schema before
# the first paid run. tag is how the prompt names the Nth image.
reference_models:
  fal:
    image:
      google/nano-banana-2.1/edit: {images_param: image_urls, max_images: 14, max_characters: 4, tag: "image {n}"}
    video:
      alibaba/wan-3.0-prime/reference-to-video:
        images_param: reference_image_urls
        max_images: 10
        tag: "Image {n}"
        durations: "5,10"
        duration_type: int
        extra: {audio: false}
      bytedance/seedance-2.0/reference-to-video:
        images_param: image_urls
        max_images: 9
        tag: "@Image{n}"
        durations: "4,5,6,8,10,12,15"
        extra: {generate_audio: false}
      fal-ai/kling-video/o1/reference-to-video:
        elements: true
        max_images: 7
        durations: "5,10"

profiles:
  short-9x16: {aspect: "9:16", width: 1080, height: 1920, fps: 30, target_lufs: -14, true_peak_dbtp_max: -1}
  square: {aspect: "1:1", width: 1080, height: 1080, fps: 30, target_lufs: -14, true_peak_dbtp_max: -1}
  landscape: {aspect: "16:9", width: 1920, height: 1080, fps: 30, target_lufs: -14, true_peak_dbtp_max: -1}
  podcast: {aspect: "audio-only", target_lufs: -16, true_peak_dbtp_max: -1}
