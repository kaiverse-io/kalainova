name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: engine contract
        run: python3 scripts/check.py
      - name: contract eval
        run: python3 scripts/check.py --fixtures evals/contract
      - name: docs stay subject-free
        run: python3 scripts/lint_docs.py
      - name: engine deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg && pip install -r requirements.txt pytest
      - name: engine tests (one local end-to-end render)
        run: python3 -m pytest -q
